[project]
name = "proj"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "plotly>=6.0",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
]

[project.scripts]
proj = "proj:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
